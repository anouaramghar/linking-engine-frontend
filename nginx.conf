# Host allowlist: unknown Host values hit the default server and are dropped
# before the shared API key is ever attached. Override names via
# LINKMESH_SERVER_NAMES (space-separated) when the dashboard is reached by a
# real hostname behind TLS termination.
map $request_method $linkmesh_require_client_header {
    default 1;
    GET     0;
    HEAD    0;
    OPTIONS 0;
}

# Simple HTML forms cannot set custom headers. Requiring this marker on unsafe
# methods blocks classic cross-site form CSRF against the authenticated proxy.
map "$linkmesh_require_client_header:$http_x_linkmesh_client" $linkmesh_client_ok {
    default 0;
    "~^0:"  1;
    "1:dashboard" 1;
}

# Starting and completing a login are unauthenticated, so they are the one door
# an anonymous caller can knock on repeatedly. A real operator uses them only
# every few hours; this also bounds guesses against one-time Telegram codes.
# $binary_remote_addr is the client only while nginx is the edge — behind
# another proxy this would key every caller to that proxy's address.
limit_req_zone $binary_remote_addr zone=linkmesh_login:1m rate=6r/m;

# nginx defaults to 503 here, which the backend already uses for "login is not
# configured". The login screen has to tell those apart to say anything useful.
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 ${LINKMESH_SERVER_NAMES};

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth browser controls. HSTS belongs on the TLS terminator in
    # front of this container, not on plain HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # The bundle is ~380 kB on the wire uncompressed and ~121 kB gzipped, and
    # nginx ships with gzip off. woff2 is already compressed, so only the text
    # types are worth listing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # Login and admission. Reachable without a session by necessity — this is
    # how a caller gets one — and deliberately without the shared key, which
    # these routes do not consume. /auth/users, /approve and /revoke gate
    # themselves on a dashboard session inside FastAPI.
    location ~ ^/api/v1/auth/login/(start|complete)$ {
        if ($linkmesh_client_ok = 0) {
            return 403;
        }

        limit_req zone=linkmesh_login burst=3 nodelay;

        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-LinkMesh-Client "";
    }

    location /api/v1/auth/ {
        if ($linkmesh_client_ok = 0) {
            return 403;
        }

        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-LinkMesh-Client "";
    }

    # auth_request target. Only the status code is read: 200 admits, 401 refuses.
    # The subrequest inherits the caller's Cookie header, which is the whole
    # input. Revocation therefore takes effect on the next request, not the
    # next login.
    location = /_linkmesh_session {
        internal;
        proxy_pass ${BACKEND_URL}/api/v1/auth/session;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-LinkMesh-Client "";
    }

    location /api/ {
        if ($linkmesh_client_ok = 0) {
            return 403;
        }

        # FE-SEC-01: the shared key is attached only downstream of a verified
        # session, so it is a proxy-to-backend credential rather than the
        # caller's identity. Without a session this returns 401 and no key is
        # ever sent upstream.
        auth_request /_linkmesh_session;

        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        # Publication preview may read several live WordPress posts and honour
        # Retry-After. Keep the proxy just above the browser's 180 s bound.
        proxy_read_timeout 190s;
        proxy_set_header X-API-Key "${LINKMESH_API_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not forward the browser CSRF marker to the backend; service clients
        # talking to the API directly never send it.
        proxy_set_header X-LinkMesh-Client "";
    }

    # Vite content-hashes every filename under /assets/, so a changed file is a
    # changed URL and the old one can be cached forever without going stale.
    # A location that sets any add_header of its own inherits none from the
    # server block, so every header above has to be repeated in full here and
    # in /index.html. Adding a header to the server block means adding it to
    # both of these too.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri =404;
    }

    # The pre-paint theme script. Not content-hashed — index.html names it by a
    # fixed path — so it revalidates rather than being held by the browser's
    # heuristic cache, which would pin an old copy for days after a change.
    location = /theme-boot.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri =404;
    }

    # The entry document is the one thing that must never be cached: it is what
    # points at the current hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
