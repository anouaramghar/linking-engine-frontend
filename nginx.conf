# Host allowlist: unknown Host values hit the default server and are dropped
# before the shared API key is ever attached. Override names via
# LINKMESH_SERVER_NAMES (space-separated) when the dashboard is reached by a
# real hostname behind TLS termination.
map $request_method $linkmesh_require_client_header {
    default 1;
    GET     0;
    HEAD    0;
    OPTIONS 0;
}

# Simple HTML forms cannot set custom headers. Requiring this marker on unsafe
# methods blocks classic cross-site form CSRF against the authenticated proxy.
map "$linkmesh_require_client_header:$http_x_linkmesh_client" $linkmesh_client_ok {
    default 0;
    "~^0:"  1;
    "1:dashboard" 1;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 ${LINKMESH_SERVER_NAMES};

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth browser controls. HSTS belongs on the TLS terminator in
    # front of this container, not on plain HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # The bundle is ~380 kB on the wire uncompressed and ~121 kB gzipped, and
    # nginx ships with gzip off. woff2 is already compressed, so only the text
    # types are worth listing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    location /api/ {
        if ($linkmesh_client_ok = 0) {
            return 403;
        }

        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header X-API-Key "${LINKMESH_API_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not forward the browser CSRF marker to the backend; service clients
        # talking to the API directly never send it.
        proxy_set_header X-LinkMesh-Client "";
    }

    # Vite content-hashes every filename under /assets/, so a changed file is a
    # changed URL and the old one can be cached forever without going stale.
    # A location that sets any add_header of its own inherits none from the
    # server block, so every header above has to be repeated in full here and
    # in /index.html. Adding a header to the server block means adding it to
    # both of these too.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    # The entry document is the one thing that must never be cached: it is what
    # points at the current hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
